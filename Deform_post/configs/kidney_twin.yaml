# Kidney digital-twin replay recipe: the proven production decisions, on disk.
# {workspace} expands to the repo root, {dataflow} to <workspace>/DataFlow.
# CLI flags override individual values; see `python main.py --help`.

# External read-only corpus; canonical path is
# data_sources.yaml[real_visual_force_dataset].path -- keep in sync.
real_data_root: "D:/Image2Force Data/Real Visual-force Paired Data"
mesh: "{dataflow}/ShapeReconstruction/meshes/kidney_anat.ply"
annotation: "{dataflow}/Deform_post/inputs/annotations/kidney_anat_contact_k1.json"
out_root: "{dataflow}/Deform_post/primary/twin_full"
exe: "{workspace}/build/DeformSim/vs2022-x64/Release/LVBasicFramework.exe"
mkl_bin: "C:/Program Files (x86)/Intel/oneAPI/mkl/latest/bin"
compiler_bin: "C:/Program Files (x86)/Intel/oneAPI/compiler/latest/bin"

# Real recordings are 30 fps; frame index <-> time mapping everywhere.
fps: 30.0

# Camera source per sequence:
#   mode: auto      - deterministic placement from the fields below, centered
#                     on each sequence's contact point (the proven default)
#   mode: profile   - a saved contact-frame view profile; pick one with
#                     `python main.py camera pick --name myview`, then set
#                     profile: myview. The chosen angle follows each
#                     sequence's own contact point.
#   mode: absolute  - a saved PinholeCameraParameters JSON applied verbatim
#                     to every sequence (does NOT follow the contact);
#                     absolute: path/to/x.camera.json
# Auto defaults: side-grazing close-up framing the contact region so the
# indentation breaks the top silhouette. Up stays +z (a +y up would be nearly
# parallel to the grazing view direction and degenerate the basis).
camera:
  mode: auto
  profile: ""
  absolute: ""
  width: 800
  height: 800
  fov_deg: 60.0
  standoff_mm: 70.0
  eye_dir: [-0.47, -0.81, 0.34]
  up: [0.0, 0.0, 1.0]

# Kidney material decision: E = 0.03 MPa (30 kPa), v = 0.49.
material:
  young_mpa: 0.03
  poisson: 0.49

sim:
  num_threads: 1
  mkl_threads: 1
  seed: 20260530

serialize:
  # 256x256 matches the real corpus and the experiment datasets (raw 800 px ~13 GB/seq).
  resize: [256, 256]
  # F3 opt-in coverage assertion: raise when any PNG lacks a labels.csv row
  # instead of the historical warn-and-drop (the coverage line + dropped-stem
  # manifest are emitted either way).
  require_full_coverage: false

batch:
  max_parallel: 1
  keep_intermediate: false

# Track C diversity factors -- every factor is config-gated and OFF by
# default (OFF keeps the render pipeline byte-identical to the legacy
# behavior). C1 appearance domain randomization, design v2 (texel-baked
# texture; the v1 flat/vertex-colour path was rejected at the 2026-08-10
# visual gate) + v3 (R23 implicit vessel layer composited into the bake):
# ranges from research/data_improve/2026-08-10-c1-appearance-dr-design.md
# v2/v3 revisions. Colour boxes are the real-corpus empirical support
# (_c1_scratch/real_color_anchor.json and real_vessel_anchor.json p05-p95).
# Per-sequence draws seed from SeedSequence([seed, sequence ordinal]); the
# R25 field module is dpost/c1_r25_procedural_microtexture.py (extracted by
# file from commit 9c74cf0), the vessel modules are dpost/c1_r21/23_*.py
# (extracted by file from commit 9d3011f) and the bake lives in
# dpost/texture_bake.py.
diversity:
  appearance:
    enabled: false
    seed: 0
    albedo_r: [0.8180, 0.8605]  # organ box (anchor organ_bright p05-p95)
    albedo_g: [0.6944, 0.7519]
    albedo_b: [0.7423, 0.7866]
    r25_variants: [candidate-1, candidate-2, candidate-3]
    r25_amplitude: [0.13, 0.18]
    background_r: [0.3943, 0.4581]  # cavity box (anchor cavity_dark p05-p95)
    background_g: [0.2834, 0.3359]
    background_b: [0.3300, 0.3871]
    brightness: [0.92, 1.08]    # per-frame numpy post-process chain (v2-4)
    contrast: [0.92, 1.08]
    gamma: [0.90, 1.12]
    vignette: [0.10, 0.35]      # real endoscope frames always carry one
    noise_sigma: [0.0, 0.008]
    texture_size: 1024          # texel bake resolution
    gutter_px: 4                # chart-border dilation against filter bleed
    fine_octave: 0.08           # appended texel-scale octave wavelength
    calibration_multiplier: [1.0, 1.0, 1.0]  # smoke colour-gate correction
    vessel_enabled: true        # v3 vessel layer; effective only when enabled
    vessel_ratio: 0.012         # frozen R23 "small" root-diameter ratio
    vessel_antialias_mm: 0.10   # R23 antialias half-width (mm)
    vessel_r: [0.6615, 0.7977]  # vessel box (real_vessel_anchor p05-p95)
    vessel_g: [0.4189, 0.5587]
    vessel_b: [0.4690, 0.6220]
    uv_sidecar: ""              # R16-schema npz; empty = xatlas at prime
