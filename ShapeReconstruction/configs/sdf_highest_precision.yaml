# Maximum-precision SDF reconstruction at resolution 96.
# Produces the highest-quality surface at significant computation cost.
mode: sdf_reconstruct

sdf_reconstruct:
  resolution: 96
  target_edge_length: 0
  remesh_iterations: 3

# Post-processing
voxel_spacing_mm: 1.0
restore_physical_coords: true
mesh_quality_fix: true
canonicalize_pose: false
pose_flip: false
