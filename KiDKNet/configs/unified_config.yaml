# KiDKNet 扈滉ｸ驟咲ｽｮ譁・ｻｶ - ConvNeXt-only

# 騾夂畑驟咲ｽｮ
general:
  # GPU (CUDA) is required; CPU is not supported.
  seed: 42  # 髫乗惻遘榊ｭ・
  num_workers: 16  # 蜃丞ｰ大ｷ･菴懃ｺｿ遞区焚驕ｿ蜈垢PU莠画瓦
  pin_memory: true  # 謨ｰ謐ｮ蜉霓ｽ蝎ｨ譏ｯ蜷ｦ菴ｿ逕ｨpin_memory
  output_dir: "outputs/experiments"  # 霎灘・譬ｹ逶ｮ蠖・
  result_dir: "outputs/evaluation_results"  # 隸・ｼｰ扈捺棡霎灘・譬ｹ逶ｮ蠖・

# 謨ｰ謐ｮ髮・・鄂ｮ
data:
  data_dir: "../Deform_post/preprocessed_data/224_DataNorm_FN_Center"  # Deform_post霎灘・謨ｰ謐ｮ逶ｮ蠖・
  enable_dataset_selection: false  # 逶ｴ謗･菴ｿ逕ｨ謖・ｮ壽焚謐ｮ髮・ｼ梧裏髴莠､莠帝画叫
  # 謨ｰ謐ｮ髮・究蛻・ｯ比ｾ・- 扈滉ｸ菴ｿ逕ｨ蟄怜・譬ｼ蠑擾ｼ悟ｼｺ蛻ｶ隕∵ｱょｮ梧紛驟咲ｽｮ
  split_ratios: 
    train: 0.6
    val: 0.2
    test: 0.2
  split_file: "dataset_split.json"  # 諡・・菫｡諱ｯ菫晏ｭ俶枚莉ｶ
  
  # 蝗ｾ蜒城｢・､・炊驟咲ｽｮ・育ｮ蛹也沿譛ｬ・悟屏荳ｺ謨ｰ謐ｮ蟾ｲ逕ｱDeform_post鬚・､・炊・・
  augmentation:
    # 譏ｯ蜷ｦ隕・尠Deform_post逧・ｽ剃ｸ蛹厄ｼ磯壼ｸｸ隶ｾ荳ｺfalse・・
    override_normalization: false
    # 蜿ｪ蝨ｨoverride_normalization荳ｺtrue譌ｶ菴ｿ逕ｨ逧・盾謨ｰ
    normalize:
      mean: [0.485, 0.456, 0.406]  # ImageNet蝮・ｼ
      std: [0.229, 0.224, 0.225]   # ImageNet譬・㊥蟾ｮ
  
  # 謨ｰ謐ｮ蜉霓ｽ遲也払驟咲ｽｮ
  loading_strategy:
    use_mmap: false     # 鮟倩ｮ､蜈ｳ髣ｭmmap
    cache_data: true    # 鮟倩ｮ､蜷ｯ逕ｨ蜈ｨ驥冗ｼ灘ｭ・
    cache_settings:
      pin_memory: true  # 蟆・ｼ灘ｭ伜錘逧・ｼ驥丞崋螳壼惠鬘ｵ髞∝・蟄倅ｸｭ・悟刈騾櫞2D莨霎・
      dtype: bfloat16   # 鮟倩ｮ､菴ｿ逕ｨbfloat16・帛庄騾・float32/float16/bfloat16
      clone_image_on_get: false
      clone_force: false
    # 豕ｨ諢擾ｼ壻ｸ､荳ｪ蜿よ焚荳崎・蜷梧慮荳ｺtrue・慶ache_data莨伜・郤ｧ譖ｴ鬮・

  # 謨ｰ謐ｮ蜉霓ｽ蝎ｨ蜿よ焚
  loader:
    shuffle: true
    drop_last: true
    prefetch_factor: 2  # 鬚・叙蝗蟄・
    persistent_workers: false  # 蜈ｳ髣ｭpersistent workers蜃丞ｰ大・蟄伜頃逕ｨ
    pin_memory_device: "cuda"  # H100莨伜喧・壼崋螳壼芦蜈ｷ菴楢ｮｾ螟・

# 讓｡蝙矩・鄂ｮ
model:
  type: "force_net"  # 讓｡蝙狗ｱｻ蝙・
  name: "forcenet"  # 讓｡蝙句錐遘ｰ
  
  # ConvNeXt鬪ｨ蟷ｲ鄂醍ｻ憺・鄂ｮ
  backbone:
    name: "convnext"
    config:
      size: "tiny"  # 蜿ｯ騾・ tiny, small, base, large
      pretrained: true  # 譏ｯ蜷ｦ菴ｿ逕ｨ鬚・ｮｭ扈・揀驥・
      freeze_backbone: false  # 譏ｯ蜷ｦ蜀ｻ扈馴ｪｨ蟷ｲ鄂醍ｻ・
  
  # 鬚・ｵ句､ｴ驟咲ｽｮ
  head:
    name: "force_regression"  # 鬚・ｵ句､ｴ邀ｻ蝙・
    config:
      hidden_dims: [512, 256, 128]  # 騾る・ConvNeXt-Tiny逧・68扈ｴ霎灘・
      dropout_rate: 0.1  # Dropout邇・
      normalize_output: false  # 譏ｯ蜷ｦ蠖剃ｸ蛹冶ｾ灘・

# 隶ｭ扈・・鄂ｮ
training:
  batch_size: 512  # 蝨ｨ蜀・ｭ伜・隶ｸ諠・・荳句｢槫刈謇ｹ螟・炊螟ｧ蟆・
  epochs: 50
  early_stopping_patience: 15  # 譌ｩ蛛懆ｽｮ謨ｰ
  # 諱｢螟肴｢ｯ蠎ｦ邏ｯ遘ｯ莉･闔ｷ蠕玲峩螟ｧ逧・怏謨・atch_size
  gradient_accumulation_steps: 1  # H100莨伜喧・壽音谺｡蟾ｲ雜ｳ螟溷､ｧ・檎ｦ∫畑譴ｯ蠎ｦ邏ｯ遘ｯ
  empty_cache_freq: 2  # 蜈ｨ驥城｢・刈霓ｽ蜷主庄蜃丞ｰ第ｸ・炊鬚醍紫・梧署蜊・ｧ閭ｽ
  prefetch_to_gpu: true  # 蜷ｯ逕ｨ蠑よｭ･GPU鬚・叙・悟刈騾滓焚謐ｮ萓帛ｺ・
  
  # H100豺ｷ蜷育ｲｾ蠎ｦ莨伜喧
  mixed_precision:
    enabled: true  # 蜷ｯ逕ｨ豺ｷ蜷育ｲｾ蠎ｦ隶ｭ扈・
    dtype: "bfloat16"  # H100鬥夜叡float16
  
  # 莨伜喧蝎ｨ隶ｾ鄂ｮ・・100莨伜喧・・
  optimizer:
    type: "adamw"  # 譖ｴ騾ょ粋螟ｧbatch隶ｭ扈・
    learning_rate: 0.0008  # 蝓ｺ莠暫atch_size=512逧・粋逅・ｼｩ謾ｾ・悟㍼蟆鷹怫闕｡
    weight_decay: 0.01  # AdamW謗ｨ闕先揀驥崎｡ｰ蜃・
    momentum: 0.9  # 莉・畑莠惨GD
  
  # 謐溷､ｱ蜃ｽ謨ｰ
  loss:
    type: "COMBINED"  # 騾蛾｡ｹ: MSE, COMBINED
    magnitude_distance: "mse"     # 蟷・ｺｦ霍晉ｦｻ・嗄se/mae/huber/smooth_l1
    angle_distance: "cosine"      # 隗貞ｺｦ霍晉ｦｻ・喞osine/sine/cosine_squared
    lambda_magnitude: 0.2         # 蟷・ｺｦ謐溷､ｱ譚・㍾20%・瑚ｧ貞ｺｦ謐溷､ｱ譚・㍾80%
    normalize_losses: false
    epsilon: 1e-8
    reduction: "mean"
    magnitude_kwargs: {}
  
  # 蟄ｦ荵邇・ｰ・ｺｦ蝎ｨ
  scheduler:
    type: "cosine"  # 騾蛾｡ｹ: step, cosine, plateau
    patience: 5  # 逕ｨ莠姿lateau
    factor: 0.5  # 逕ｨ莠市tep蜥継lateau
    min_lr: 0.00001  # 譛蟆丞ｭｦ荵邇・
  
  # 譴ｯ蠎ｦ陬∝岡
  clip_grad_norm: 0  # 譴ｯ蠎ｦ闌・焚髯仙宛・・陦ｨ遉ｺ荳崎｣∝岡

# 隸・ｼｰ驟咲ｽｮ
evaluation:
  metrics:
    - magnitude_mean_relative_error
    - magnitude_accuracy_10pct
    - magnitude_accuracy_5pct
    - mean_angle_error
    - component_errors
  main_metric: "magnitude_accuracy_10pct"  # 荳ｻ隕∬ｯ・ｼｰ謖・・
  
  # 蜿ｯ隗・喧隶ｾ鄂ｮ
  visualization:
    enabled: true  # 譏ｯ蜷ｦ逕滓・蜿ｯ隗・喧扈捺棡
    num_samples: 10  # 蜿ｯ隗・喧逧・ｷ譛ｬ謨ｰ驥・
    save_path: "outputs/evaluation_viz"

monitoring:
  enable_memory_monitoring: true
  memory_monitor_interval: 1.0

# 莠､蜿蛾ｪ瑚ｯ・・鄂ｮ
cross_validation:
  enabled: false  # 鮟倩ｮ､荳榊星逕ｨ
  n_folds: 5  # 謚俶焚
  stratify: true  # 譏ｯ蜷ｦ霑幄｡悟・螻る㊦譬ｷ

# 隶ｰ蠖募柱譽譟･轤ｹ驟咲ｽｮ
logging:
  keep_best: true  # 譏ｯ蜷ｦ菫晉蕗譛菴ｳ讓｡蝙・
  keep_last: 5  # 菫晉蕗譛霑醍噪譽譟･轤ｹ謨ｰ驥・
