# KiDKNet 统一配置文件 - ConvNeXt-only

# 通用配置
general:
  # GPU (CUDA) is required; CPU is not supported.
  seed: 42  # 随机种子
  num_workers: 16  # 减少工作线程数避免CPU争抢
  pin_memory: true  # 数据加载器是否使用pin_memory
  output_dir: "outputs/experiments"  # 输出根目录
  result_dir: "outputs/evaluation_results"  # 评估结果输出根目录

# 数据集配置
data:
  data_dir: "../Deform_post/preprocessed_data/224_DataNorm_FN_Center"  # Deform_post输出数据目录
  enable_dataset_selection: false  # 直接使用指定数据集，无需交互选择
  # 数据集拆分比例 - 统一使用字典格式，强制要求完整配置
  split_ratios: 
    train: 0.6
    val: 0.2
    test: 0.2
  split_file: "dataset_split.json"  # 拆分信息保存文件
  
  # 图像预处理配置（简化版本，因为数据已由sim2vfp预处理）
  augmentation:
    # 是否覆盖sim2vfp的归一化（通常设为false）
    override_normalization: false
    # 只在override_normalization为true时使用的参数
    normalize:
      mean: [0.485, 0.456, 0.406]  # ImageNet均值
      std: [0.229, 0.224, 0.225]   # ImageNet标准差
  
  # 数据加载策略配置
  loading_strategy:
    use_mmap: false     # 默认关闭mmap
    cache_data: true    # 默认启用全量缓存
    cache_settings:
      pin_memory: true  # 将缓存后的张量固定在页锁内存中，加速H2D传输
      dtype: bfloat16   # 默认使用bfloat16；可选 float32/float16/bfloat16
      clone_image_on_get: false
      clone_force: false
    # 注意：两个参数不能同时为true，cache_data优先级更高

  # 数据加载器参数
  loader:
    shuffle: true
    drop_last: true
    prefetch_factor: 2  # 预取因子
    persistent_workers: false  # 关闭persistent workers减少内存占用
    pin_memory_device: "cuda"  # H100优化：固定到具体设备

# 模型配置
model:
  type: "force_net"  # 模型类型
  name: "forcenet"  # 模型名称
  
  # ConvNeXt骨干网络配置
  backbone:
    name: "convnext"
    config:
      size: "tiny"  # 可选: tiny, small, base, large
      pretrained: true  # 是否使用预训练权重
      freeze_backbone: false  # 是否冻结骨干网络
  
  # 预测头配置
  head:
    name: "force_regression"  # 预测头类型
    config:
      hidden_dims: [512, 256, 128]  # 适配ConvNeXt-Tiny的768维输出
      dropout_rate: 0.1  # Dropout率
      normalize_output: false  # 是否归一化输出

# 训练配置
training:
  batch_size: 512  # 在内存允许情况下增加批处理大小
  epochs: 50
  early_stopping_patience: 15  # 早停轮数
  # 恢复梯度累积以获得更大的有效batch_size
  gradient_accumulation_steps: 1  # H100优化：批次已足够大，禁用梯度累积
  empty_cache_freq: 2  # 全量预加载后可减少清理频率，提升性能
  prefetch_to_gpu: true  # 启用异步GPU预取，加速数据供应
  
  # H100混合精度优化
  mixed_precision:
    enabled: true  # 启用混合精度训练
    dtype: "bfloat16"  # H100首选bfloat16
  
  # 优化器设置（H100优化）
  optimizer:
    type: "adamw"  # 更适合大batch训练
    learning_rate: 0.0008  # 基于batch_size=512的合理缩放，减少震荡
    weight_decay: 0.01  # AdamW推荐权重衰减
    momentum: 0.9  # 仅用于SGD
  
  # 损失函数
  loss:
    type: "COMBINED"  # 选项: MSE, COMBINED
    magnitude_distance: "mse"     # 幅度距离：mse/mae/huber/smooth_l1
    angle_distance: "cosine"      # 角度距离：cosine/sine/cosine_squared
    lambda_magnitude: 0.2         # 幅度损失权重20%，角度损失权重80%
    normalize_losses: false
    epsilon: 1e-8
    reduction: "mean"
    magnitude_kwargs: {}
  
  # 学习率调度器
  scheduler:
    type: "cosine"  # 选项: step, cosine, plateau
    patience: 5  # 用于plateau
    factor: 0.5  # 用于step和plateau
    min_lr: 0.00001  # 最小学习率
  
  # 梯度裁剪
  clip_grad_norm: 0  # 梯度范数限制，0表示不裁剪

# 评估配置
evaluation:
  metrics:
    - magnitude_mean_relative_error
    - magnitude_accuracy_10pct
    - magnitude_accuracy_5pct
    - mean_angle_error
    - component_errors
  main_metric: "magnitude_accuracy_10pct"  # 主要评估指标
  
  # 可视化设置
  visualization:
    enabled: true  # 是否生成可视化结果
    num_samples: 10  # 可视化的样本数量
    save_path: "outputs/evaluation_viz"

monitoring:
  enable_memory_monitoring: true
  memory_monitor_interval: 1.0

# 交叉验证配置
cross_validation:
  enabled: false  # 默认不启用
  n_folds: 5  # 折数
  stratify: true  # 是否进行分层采样

# 记录和检查点配置
logging:
  keep_best: true  # 是否保留最佳模型
  keep_last: 5  # 保留最近的检查点数量
