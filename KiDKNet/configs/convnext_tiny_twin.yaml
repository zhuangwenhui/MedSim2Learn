# KiDKNet ConvNeXt-Tiny - kidney digital-twin dataset (twin_merged, 32 sequences)
# Derived from convnext_tiny_config.yaml. Only data.* and image normalization
# are changed to point at the assembled twin dataset and the by-sequence split.
#
# Run (CWD must be KiDKNet/, CUDA required):
#   python main.py --mode train    --config configs/convnext_tiny_twin.yaml
#   python main.py --mode evaluate --config configs/convnext_tiny_twin.yaml   # reads best_model.pth
#
# NOTE: do NOT run `--mode split` with this config -- the split is authored
# by-sequence (assemble_twin_dataset.py) to avoid temporal leakage; the built-in
# splitter would overwrite it with a leaky random holdout.
# NOTE: KiDKNet has no resume; a crash/sleep mid-run loses progress. Keep the
# machine awake for the full run (e.g. powercfg, or run while attended).

general:
  seed: 42
  num_workers: 16
  pin_memory: true
  output_dir: "D:/MedSim2Learn-ComplexObject/DataFlow/KiDKNet/outputs/experiments"
  result_dir: "D:/MedSim2Learn-ComplexObject/DataFlow/KiDKNet/outputs/evaluation_results"

data:
  # Absolute path to the assembled merged dataset (must match the data_dir baked
  # into dataset_split.json by assemble_twin_dataset.py).
  data_dir: "D:/MedSim2Learn-ComplexObject/DataFlow/Deform_post/twin_merged"
  enable_dataset_selection: false
  split_ratios:
    train: 0.7
    val: 0.15
    test: 0.15
  # By-sequence split written under DataFlow/KiDKNet/splits/ by assemble_twin_dataset.py.
  split_file: "D:/MedSim2Learn-ComplexObject/DataFlow/KiDKNet/splits/dataset_split.json"

  augmentation:
    # ON: the ConvNeXt backbone is ImageNet-pretrained, so match that input
    # distribution. The .pt images stay raw [0,1]; the loader applies this.
    override_normalization: true
    normalize:
      mean: [0.485, 0.456, 0.406]  # ImageNet mean
      std: [0.229, 0.224, 0.225]   # ImageNet std

  loading_strategy:
    use_mmap: false
    cache_data: true
    cache_settings:
      pin_memory: true
      dtype: bfloat16
      clone_image_on_get: false
      clone_force: false

  loader:
    shuffle: true
    drop_last: true
    prefetch_factor: 2
    persistent_workers: false
    pin_memory_device: "cuda"

model:
  type: "force_net"
  name: "forcenet"
  backbone:
    name: "convnext"
    config:
      size: "tiny"
      pretrained: true
      freeze_backbone: false
  head:
    name: "force_regression"
    config:
      hidden_dims: [512, 256, 128]
      dropout_rate: 0.1
      normalize_output: false

training:
  batch_size: 250
  epochs: 50
  early_stopping_patience: 15
  gradient_accumulation_steps: 1
  empty_cache_freq: 5
  prefetch_to_gpu: true
  mixed_precision:
    enabled: true
    dtype: "bfloat16"
  optimizer:
    type: "adamw"
    learning_rate: 0.0004
    weight_decay: 0.05
    momentum: 0.9
  loss:
    type: "COMBINED"
    magnitude_distance: "vector_mse"
    angle_distance: "cosine_squared"
    lambda_magnitude: 0.4
    normalize_losses: false
    epsilon: 1e-8
    reduction: "mean"
    magnitude_kwargs: {}
  scheduler:
    type: "cosine"
    patience: 5
    factor: 0.5
    min_lr: 0.00001
  clip_grad_norm: 0

evaluation:
  metrics:
    - magnitude_mean_relative_error
    - magnitude_accuracy_10pct
    - magnitude_accuracy_5pct
    - mean_angle_error
    - component_errors
  main_metric: "magnitude_accuracy_10pct"
  visualization:
    enabled: true
    num_samples: 10
    save_path: "outputs/evaluation_viz"

monitoring:
  enable_memory_monitoring: true
  memory_monitor_interval: 1.0

cross_validation:
  enabled: false
  n_folds: 5
  stratify: true

logging:
  keep_best: true
  keep_last: 5
