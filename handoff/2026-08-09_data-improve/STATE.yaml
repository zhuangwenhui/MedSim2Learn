fable5_policy:
  intended_model: claude-fable-5
  minimum_claude_code_version: 2.1.170
  task_classification:
    - non_clinical_software_engineering
    - computer_graphics
    - synthetic_data_generation
    - machine_learning_domain_gap_research
  explicitly_out_of_scope:
    - diagnosis
    - treatment
    - clinical_decision_making
    - patient_specific_advice
    - wet_lab_protocols
    - pathogens
    - genetic_engineering
    - biological_manufacturing
  allowed_default_data:
    - source_code
    - synthetic_meshes
    - synthetic_renders
    - derived_non_identifying_images
    - frozen_aggregate_statistics
    - formal_verification_artifacts
  prohibited_without_human_data_governance_confirmation:
    - PHI
    - patient_identifiers
    - unredacted_clinical_records
    - reidentifiable_raw_video
  retention_notice:
    days: 30
    zero_data_retention_available: false
  refusal_handling:
    evasion_prohibited: true
    sequence:
      - preserve_refusal_as_checkpoint
      - restate_true_non_clinical_scope
      - narrow_to_code_rendering_statistics_or_documentation
      - accept_platform_automatic_safety_routing_without_prompt_manipulation
      - never_rewrite_or_split_the_prompt_to_induce_a_fallback
      - require_human_authorization_before_manually_changing_models
      - preserve_the_same_true_scope_and_limits_on_any_authorized_model
      - hand_to_human_if_no_compliant_route_is_authorized
  cost_strategy:
    main_model_work:
      - architecture
      - scientific_claim_boundary
      - plan_review
      - final_review
    delegate_work:
      - repository_search
      - hash_calculation
      - test_execution
      - static_checks
      - manifest_replay
  official_sources:
    - https://platform.claude.com/docs/en/about-claude/models/introducing-claude-fable-5-and-claude-mythos-5
    - https://support.claude.com/en/articles/15424964-claude-fable-5-on-your-plan
    - https://www.anthropic.com/claude/fable
    - https://www.anthropic.com/news/updating-our-usage-policy

